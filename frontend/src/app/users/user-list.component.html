<div class="users-page">
  <div class="header">
    <h2>Users</h2>
    <a class="btn" routerLink="/users/create">+ Create</a>
  </div>
  <div *ngIf="loading">Loading…</div>
  <div class="error" *ngIf="error">{{ error }}</div>
  <table class="table" *ngIf="!loading && !error">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Role</th>
        <th>Created</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of users">
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ roleName(u) }}</td>
        <td>{{ u.created_at | date:'short' }}</td>
        <td>
          <button class="btn" (click)="deleteUser(u)" [disabled]="!canDelete(u) || deletingUserId !== null">
            {{ deletingUserId === u.id ? 'Deleting...' : 'Delete' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
