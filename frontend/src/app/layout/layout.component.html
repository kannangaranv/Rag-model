<div class="app-shell" [class.sidebar-collapsed]="collapsed">
  <header class="topbar d-flex align-items-center px-3">
    <div class="userblock" *ngIf="me as u">
      <button class="btn-logout" (click)="logout()" title="Logout">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M10 3a1 1 0 0 1 1 1v4h-2V5H6v14h3v-3h2v4a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5zm5.293 4.293 1.414 1.414L14.414 12l2.293 2.293-1.414 1.414L12.586 13H9v-2h3.586l2.707-3.707z"/>
        </svg>
      </button>
      <span class="username">{{ u.username }}</span>
    </div>
    <div class="brand d-flex align-items-center">
      <img src="assets/images/Logo.png" alt="BoardPAC Logo" class="logo me-2" />
      <span class="brand-name">POC of AI-Assistant</span>
    </div>
  </header>

  <aside class="sidebar">
    <nav class="nav flex-column">
      <a class="nav-link" routerLink="/chat" routerLinkActive="active" *ngIf="!me || me.level !== 1">
        <i class="bi bi-chat-dots me-2"></i> AI Assistant
      </a>

      <a class="nav-link" routerLink="/knowledge-base" routerLinkActive="active" *ngIf="me && me.can_upload">
        <i class="bi bi-collection me-2"></i> Knowledge Base
      </a>

      <a class="nav-link" routerLink="/papers" routerLinkActive="active" *ngIf="me">
        <i class="bi bi-file-earmark-text me-2"></i> Papers
      </a>

      <a class="nav-link" routerLink="/users" routerLinkActive="active" *ngIf="me && me.level === 1">
        <i class="bi bi-people me-2"></i> Users
      </a>

      <a class="nav-link" routerLink="/users/create" routerLinkActive="active" *ngIf="me && me.level === 1">
        <i class="bi bi-person-plus me-2"></i> Create User
      </a>
    </nav>
  </aside>
  <main class="content-area">
    <router-outlet></router-outlet>
  </main>
</div>
